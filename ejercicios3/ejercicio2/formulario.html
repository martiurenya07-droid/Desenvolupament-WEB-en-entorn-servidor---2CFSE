<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow mx-auto" style="max-width: 700px;">

            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Formulario de usuario</h2>
            </div>

            <div class="card-body">

                <form action="formulario.php" method="post">

                    <div class="mb-3">
                        <label class="form-label">Nombre y apellidos:</label>
                        <input type="text" name="nombre" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Página personal:</label>
                        <input type="url" name="web" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Sexo:</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="sexo"
                                   value="Hombre">

                            <label class="form-check-label">Hombre</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="sexo"
                                   value="Mujer">

                            <label class="form-check-label">Mujer</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Número de convivientes:</label>
                        <input type="number"
                               name="convivientes"
                               class="form-control">
                    </div>

                    <div class="mb-3">

                        <label class="form-label d-block">Aficiones:</label>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="aficiones[]"
                                   value="Deporte">
                            <label class="form-check-label">Deporte</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="aficiones[]"
                                   value="Cine">
                            <label class="form-check-label">Cine</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="aficiones[]"
                                   value="Musica">
                            <label class="form-check-label">Música</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="aficiones[]"
                                   value="Videojuegos">
                            <label class="form-check-label">Videojuegos</label>
                        </div>

                    </div>

                    <div class="mb-4">
                        <label class="form-label">Menú favorito:</label>

                        <select name="menu[]"
                                multiple
                                class="form-select">

                            <option value="Pizza">Pizza</option>
                            <option value="Hamburguesa">Hamburguesa</option>
                            <option value="Pasta">Pasta</option>
                            <option value="Paella">Paella</option>

                        </select>

                        <div class="form-text">
                            Puedes seleccionar varias opciones.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Enviar
                    </button>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
